version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'spleck'
    assignees:
      - 'spleck'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      dev-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - 'blessed*'
          - 'systeminformation'
      production-dependencies:
        patterns:
          - 'blessed*'
          - 'systeminformation'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'spleck'
    commit-message:
      prefix: 'chore(actions)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'

name: Security Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gate 1: production dependencies must be free of moderate+ advisories.
      - name: "Audit production dependencies (gate: moderate+)"
        run: npm audit --omit=dev --audit-level=moderate

      # Gate 2: high/critical advisories gate anywhere in the tree, including
      # dev dependencies. Moderate dev-only advisories do not fail the gate.
      # Known non-gating case: sprintf-js <=1.1.3 (DoS via unbounded precision
      # specifiers), transitive via jest -> @istanbuljs/load-nyc-config ->
      # js-yaml@3 -> argparse -> sprintf-js. No patched sprintf-js release
      # exists (all versions <=1.1.3, i.e. every published version; package
      # dormant) and the chain is test tooling only, unreachable at runtime
      # (js-yaml is used as a library, not its CLI). Revisit if sprintf-js
      # ships a fix or jest drops the js-yaml@3 chain.
      - name: "Audit all dependencies (gate: high/critical)"
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
